# Runs the naming and style linters on every push and pull request.
# A failure here blocks the change until the names are fixed.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  css:
    name: CSS naming and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:css

  python:
    name: Python naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pylint tools

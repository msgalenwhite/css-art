# Runs the Google style guide checks on every push and pull request.
# A failure here blocks the change until it is fixed.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  css-and-html:
    name: CSS and HTML (Google HTML/CSS Style Guide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:css
      - run: npm run lint:html

  python:
    name: Python (Google Python Style Guide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pylint tools tests
      - run: yapf --diff --recursive tools tests

  pieces:
    name: Pieces match their breakdowns and follow the rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python3 tools/check_pieces.py
      # The checker is only worth trusting if it rejects broken pieces, so
      # its own tests run here too.
      - run: python3 -m pytest

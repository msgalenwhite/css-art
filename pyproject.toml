# Lint rules for the Python tools in this repo.
# Run with:  pylint tools
#
# Only the naming checks are switched on. Their job is to keep the code
# readable by people and agents: every name must be whole words, never a
# single letter or a clipped abbreviation.

[tool.pylint.main]
disable = ["all"]
enable = ["invalid-name", "disallowed-name"]

[tool.pylint.basic]
# snake_case, at least three characters long.
variable-rgx = "^[a-z][a-z0-9_]{2,}$"
argument-rgx = "^[a-z][a-z0-9_]{2,}$"
attr-rgx = "^[a-z][a-z0-9_]{2,}$"
function-rgx = "^[a-z][a-z0-9_]{2,}$"
method-rgx = "^[a-z][a-z0-9_]{2,}$"
# Loop variables inside comprehensions follow the same rule.
inlinevar-rgx = "^[a-z][a-z0-9_]{2,}$"
# Module-level constants: UPPER_SNAKE_CASE, at least three characters long.
const-rgx = "^[A-Z][A-Z0-9_]{2,}$"
class-rgx = "^[A-Z][a-zA-Z0-9]{2,}$"

# No names are exempt. (Pylint normally lets i, j, k, ex, Run and _ through.)
good-names = []

# Abbreviations that are long enough to pass the length rule but still
# make a reader stop and decode. Spell the word out instead.
bad-names = [
  "arr", "buf", "cfg", "cnt", "ctx", "cur", "dst", "elem", "idx", "img",
  "len", "lst", "msg", "num", "obj", "pos", "ptr", "res", "ret", "src",
  "tmp", "val", "var",
]
